# ═══════════════════════════════════════════════════════════════════════════
# XAVFSIZLIK DARVOZASI — deploy'dan OLDIN ishlaydi.
#
# ── NEGA KERAK ──
# `deploy.yml` faqat SSH qilib `deploy.sh` ni chaqiradi, ya'ni HECH QANDAY
# test ishlamasdi. Filial ko'lami, owner-only kalitlar va rol tipi bo'yicha
# tekshiruvlar mavjud edi, lekin ularni hech kim yurgizmasdi — "bor, lekin
# ishlamaydigan" xavfsizlik nazorati.
#
# ── FAQAT MUSTAQIL TESTLAR ──
# Bu yerda TIRIK SERVER yoki BAZA talab qilmaydigan testlargina bor. HTTP
# talab qiladigan ~50 ta `*-parity.test.mjs` ATAYLAB chaqirilmaydi: ular
# o'chirilgan Express (`127.0.0.1:5001`) ga qaraydi va hech narsani
# tekshirmaydi.
#
# `constants-parity` chiqish kodini O'ZI qaytaradi
# (`process.exit(R.fail ? 1 : 0)`), `feature-graph` esa yalang'och
# `assert` ishlatadi — ushlanmagan AssertionError Node'ni 1 bilan
# tugatadi. Ikkalasi ham CI'da HAQIQATAN yiqila oladi.
# ═══════════════════════════════════════════════════════════════════════════
name: Security gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — typecheck, build, security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # `postinstall` `prisma generate` ni o'zi chaqiradi — tirik baza
      # kerak emas, faqat sxema fayli yetarli.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # ⚠ TESTLAR `dist/` DAN IMPORT QILADI — shuning uchun qurish SHART.
      # Aks holda eskirgan `dist` bilan yashil natija chiqib, u hech
      # narsani isbotlamasdi.
      - name: Build
        run: npm run build

      - name: Owner-only permission keys
        run: npm run test:owner-only-keys

      - name: Role-type privilege escalation
        run: npm run test:role-type-escalation

      - name: Resource scope registry (schema drift)
        run: npm run test:resource-scope

      - name: Workspace resolution
        run: npm run test:workspace-resolve

      - name: Branch limit entitlement
        run: npm run test:branch-limit

      - name: Branch write-intent guard
        run: npm run test:branch-intent

      - name: Constants parity (permission registries)
        run: npm run test:constants

      - name: Feature graph integrity
        run: npm run test:feature-graph

      # ── ARXITEKTURA CHEGARASI ──
      # `scripts/arch-scan.mjs` + `test/architecture.baseline.json`.
      # Mavjud qarz baseline'da; YANGI modullararo chuqur import, begona
      # validator importi, `common/` → `modules/` yoki yangi sikl — qizil.
      # Baseline faqat qisqaradi (`npm run arch:baseline` o'sishni rad etadi).
      - name: Architecture boundaries (no new violations)
        run: npm run test:architecture

      # Parol formati — markaz egasi hash bilan, qolganlar ochiq matnda.
      # Bu test buzuq hash har qanday parolni qabul qilgan HAQIQIY
      # teshikni ushlagan; regressiya qaytmasin.
      - name: Password format (hash + legacy)
        run: npm run test:password-format

  # ═══════════════════════════════════════════════════════════════════════
  # ADMIN_SERVER — ESM ↔ CJS NOMLI IMPORT
  #
  # `tsc` bu xatoni KO'RMAYDI: tiplar `@types/...` da bor, lekin Node
  # CommonJS paketdan nomli eksportni statik tahlil bilan topadi va
  # hammasini ko'ra olmaydi. Natija — build yashil, ishga tushirish
  # yiqiladi ("does not provide an export named 'utils'").
  # ═══════════════════════════════════════════════════════════════════════
  admin-server-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin_server/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
      - name: ESM/CJS named imports resolve at runtime
        run: npm run test:esm-imports
      - name: ESLint
        run: npm run lint

      # Naqsh bilan ifodalanadigan chegaralar (begona validator, common→modules)
      # — IDE'da ham ko'rinadi. `--max-warnings` YO'Q: ogohlantirishlar
      # (unused-vars) kod sifati, chegara emas; ular qizil qilmaydi.
      - name: ESLint (boundaries as errors)
        run: npm run lint
